<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/admin-icon.svg">
<title>soul · тех-панель</title>
<style>
  :root{ --bg:#0e0f12; --panel:#16181d; --panel2:#1c1f26; --line:#2a2e37; --text:#e8e6e0; --hint:#8a8f9a; --accent:#c0a080; --bad:#c2683f; --good:#5bbf73; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,Inter,Segoe UI,sans-serif; }
  header{ padding:22px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header .logo{ font-weight:800; letter-spacing:2px; }
  header .sub{ color:var(--hint); font-size:13px; }
  header .who{ margin-left:auto; color:var(--hint); font-size:13px; }
  .wrap{ padding:24px 28px; max-width:1200px; margin:0 auto; }
  .stat-row{ display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 18px; min-width:120px; }
  .stat .v{ font-size:24px; font-weight:700; }
  .stat .k{ color:var(--hint); font-size:12px; margin-top:2px; }
  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  th,td{ text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th{ color:var(--hint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--panel2); }
  .pill{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; border:1px solid var(--line); }
  .pill.on{ color:var(--good); border-color:rgba(91,191,115,.4); }
  .pill.off{ color:var(--hint); }
  .muted{ color:var(--hint); }
  .small{ font-size:11px; }
  .err{ color:var(--bad); padding:40px; text-align:center; }
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50; }
  .overlay.on{ display:flex; }
  .sheet{ background:var(--panel); border:1px solid var(--line); border-radius:18px; max-width:820px; width:100%; padding:26px 28px; }
  .sheet h2{ margin:0 0 4px; font-size:20px; word-break:break-all; }
  .close{ float:right; background:none; border:1px solid var(--line); color:var(--hint); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .sec{ margin-top:22px; }
  .sec h3{ font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); margin:0 0 10px; }
  .block{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; white-space:pre-wrap; font-size:13px; }
  .msg{ padding:8px 12px; border-radius:10px; margin-bottom:6px; font-size:13px; white-space:pre-wrap; }
  .msg.user{ background:#23262e; }
  .msg.assistant{ background:#1a2620; }
  .msg .r{ font-size:10px; text-transform:uppercase; color:var(--hint); margin-bottom:3px; }
  .entry{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; white-space:pre-wrap; }
  .entry .d{ font-size:11px; color:var(--hint); margin-bottom:4px; }
  .entry .fb{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); color:var(--hint); font-style:italic; font-size:12px; }
  .tabs{ display:flex; gap:8px; margin-bottom:22px; }
  .tab{ background:var(--panel); border:1px solid var(--line); color:var(--hint); border-radius:999px; padding:8px 18px; cursor:pointer; font:inherit; font-size:13px; }
  .tab.on{ color:var(--text); border-color:var(--accent); background:var(--panel2); }
  .card2{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:16px; }
  .card2 h2{ margin:0 0 4px; font-size:17px; }
  .card2 .lead{ color:var(--hint); font-size:13px; margin-bottom:14px; }
  .layer{ background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .layer b{ color:var(--text); }
  .layer .t{ color:var(--hint); font-size:13px; margin-top:3px; }
  .flow{ display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
  .box{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:12px; flex:1; min-width:120px; }
  .box .h{ color:var(--accent); font-size:10px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
  .arrow{ align-self:center; color:var(--hint); font-size:18px; }
  .pipe{ list-style:none; padding:0; margin:0; }
  .pipe li{ padding:9px 0 9px 26px; position:relative; border-bottom:1px solid var(--line); font-size:13px; }
  .pipe li:last-child{ border-bottom:none; }
  .pipe li:before{ content:"▸"; position:absolute; left:6px; color:var(--accent); }
  .pipe li b{ color:var(--text); }
  .cfg{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .cfg-h{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .cfg-h b{ font-size:14px; }
  .cfg-d{ color:var(--hint); font-size:12px; margin-bottom:8px; }
  .cfg-area{ width:100%; min-height:120px; resize:vertical; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:13px/1.5 ui-monospace,Menlo,monospace; }
  .cfg-input{ width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:14px inherit; }
  .cfg-act{ display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .cfg-btn{ background:var(--accent); color:#1a1410; border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font:inherit; font-size:13px; font-weight:600; }
  .cfg-btn.ghost{ background:transparent; color:var(--hint); border:1px solid var(--line); font-weight:400; }
  .cfg-flash{ color:var(--good); font-size:12px; }
  .cfg-flash.bad{ color:var(--bad); }
  /* полировка */
  .card2{ transition:border-color .2s; }
  .card2 h2{ letter-spacing:.2px; }
  .tab{ transition:color .15s, border-color .15s, background .15s; }
  .tab:hover{ color:var(--text); }
  .cfg-btn{ transition:filter .15s, transform .1s; }
  .cfg-btn:hover{ filter:brightness(1.08); }
  .cfg-btn:active{ transform:scale(.96); }
  .mr-tile{ transition:border-color .2s; }
  .mr-tile:hover{ border-color:var(--accent); }
  details.sec2>summary:hover{ color:var(--accent); }
  .tc-sel,.cfg-input,.cfg-area,.tc-len{ transition:border-color .15s; }
  .tc-sel:focus,.cfg-input:focus,.cfg-area:focus,.tc-len:focus{ outline:none; border-color:var(--accent); }
  .tc-log{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:140px; max-height:400px; overflow:auto; margin-bottom:10px; display:flex; flex-direction:column; gap:6px; }
  .tc-log:empty:before{ content:"пусто — напиши и проверь характер"; color:var(--hint); font-size:13px; }
  .tc-log .msg{ max-width:82%; margin:0; }
  .tc-log .msg.user{ align-self:flex-end; background:var(--accent); color:#1a1410; }
  .tc-log .msg.user .r{ color:#5c4a36; }
  .tc-row{ display:flex; gap:8px; align-items:flex-end; }
  .tc-inp{ flex:1; min-height:46px; max-height:120px; }
  .tc-clear{ background:transparent; color:var(--hint); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; font-size:12px; }
  /* collapsible-секции (минимализм: открыто только нужное) */
  details.sec2{ border:1px solid var(--line); border-radius:14px; margin-bottom:12px; background:var(--panel); overflow:hidden; }
  details.sec2>summary{ list-style:none; cursor:pointer; padding:15px 20px; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:space-between; }
  details.sec2>summary::-webkit-details-marker{ display:none; }
  details.sec2>summary::after{ content:"▾"; color:var(--hint); transition:transform .2s; }
  details.sec2[open]>summary::after{ transform:rotate(180deg); }
  .sec2-body{ padding:2px 20px 18px; }
  /* модели: плитки маршрута */
  .model-route{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .mr-tile{ flex:1; min-width:150px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .mr-tile .h{ color:var(--accent); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .mr-tile .m{ font-family:ui-monospace,Menlo,monospace; font-size:12px; margin-top:4px; word-break:break-all; color:var(--text); }
  .mr-tile .d{ color:var(--hint); font-size:11px; margin-top:4px; }
  /* песочница / A/B */
  .tc-bar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .tc-sel{ background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:13px inherit; max-width:240px; }
  .tc-sel:disabled{ opacity:.4; }
  label.tc-check{ display:flex; align-items:center; gap:6px; color:var(--hint); font-size:12px; cursor:pointer; }
  .tc-cols{ display:flex; gap:10px; flex-wrap:wrap; }
  .tc-col{ flex:1 1 200px; min-width:0; }
  .tc-slot{ display:inline-flex; align-items:center; gap:6px; }
  .tc-col .h{ font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.4px; margin-bottom:5px; }
  .tc-col .msg{ max-width:100%; }
  .cfg-pre{ margin-bottom:8px; }
  /* тумблеры слоёв промпта в песочнице */
  .tc-settings{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:10px; padding:11px 14px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; }
  .tc-settings label.tc-check{ color:var(--text); }
  .tc-settings input[type=checkbox]{ accent-color:var(--accent); width:15px; height:15px; }
  .tc-len{ width:62px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:13px inherit; }
</style>
</head>
<body>
<header>
  <span class="logo">◆ MOOD</span><span class="sub">админ · база тестировщиков</span>
  <span class="who" id="who"></span>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="stat-row" id="stats"></div>
  <div id="content"><div class="muted">загружаю…</div></div>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const token = localStorage.getItem("mood_token") || "";

/* DOM-билдер: значения через textContent → XSS-безопасно */
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") n.className = props[k];
    else if (k === "text") n.textContent = props[k];
    else if (k === "onclick") n.onclick = props[k];
    else n.setAttribute(k, props[k]);
  }
  for (const c of kids) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
const fmtDate = (ts) => { if (!ts) return "—"; const d = new Date(ts*1000); return isNaN(d) ? "—" : d.toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); };
const ago = (ts) => { if (!ts) return "—"; const s=Date.now()/1000-ts; if(s<3600)return Math.round(s/60)+" мин назад"; if(s<86400)return Math.round(s/3600)+" ч назад"; return Math.round(s/86400)+" дн назад"; };

async function api(path) {
  const r = await fetch(path, { headers:{ "Authorization":"Bearer "+token }, cache:"no-store" });
  if (!r.ok) throw Object.assign(new Error("HTTP "+r.status), { status:r.status });
  return r.json();
}
function showErr(msg) { const c = $("content"); clear(c); c.append(el("div",{class:"err",text:msg})); }

async function load() {
  if (!token) { showErr("нет токена. зайди сначала в приложение под своим Google-аккаунтом, потом открой эту страницу."); return; }
  let data;
  try { data = await api("/api/admin/overview"); }
  catch (e) { showErr(e.status===403 ? "доступ только для владельца аккаунта" : "ошибка: "+e.message); return; }
  $("who").textContent = data.owner_email || "";
  const us = data.users || [];
  const sum = (k) => us.reduce((a,u)=>a+(u[k]||0),0);
  const active7 = us.filter(u=>u.last_activity && (Date.now()/1000-u.last_activity)<7*86400).length;
  const stats = $("stats"); clear(stats);
  [["всего аккаунтов",us.length],["активны за 7 дн",active7],["сообщений",sum("messages")],["записей дневника",sum("diary")],["портретов",us.filter(u=>u.portrait).length]]
    .forEach(([k,v]) => stats.append(el("div",{class:"stat"}, el("div",{class:"v",text:v}), el("div",{class:"k",text:k}))));

  const head = el("tr", null, ...["#","почта","имя","посл. активность","сообщ.","дневник","досье","портрет","онбординг"].map(h=>el("th",{text:h})));
  const tbody = el("tbody");
  us.forEach(u => {
    const actCell = el("td", null, ago(u.last_activity), el("div",{class:"muted small",text:fmtDate(u.last_activity)}));
    const portrait = el("span",{class:"pill "+(u.portrait?"on":"off"),text:u.portrait?"есть":"нет"});
    const onb = el("span",{class:"pill "+(u.onboarded?"on":"off"),text:u.onboarded?"да":"нет"});
    const tr = el("tr",{onclick:()=>openUser(u.id)},
      el("td",{class:"muted",text:u.id}),
      el("td",{text:u.email||"—"}),
      el("td",{text:u.name||"—"}),
      actCell,
      el("td",{text:u.messages+" / "+u.user_msgs}),
      el("td",{text:u.diary}),
      el("td",{text:u.docs+(u.docs_bytes?" · "+Math.round(u.docs_bytes/1024)+"КБ":"")}),
      el("td",null,portrait),
      el("td",null,onb));
    tbody.append(tr);
  });
  const c = $("content"); clear(c); c.append(el("table",null, el("thead",null,head), tbody));
}

function section(title, ...body) { return el("div",{class:"sec"}, el("h3",{text:title}), ...body); }

async function openUser(id) {
  const sheet = $("sheet"); clear(sheet); sheet.append(el("div",{class:"muted",text:"загружаю…"}));
  $("overlay").classList.add("on");
  let d;
  try { d = await api("/api/admin/user?id="+id); }
  catch (e) { clear(sheet); sheet.append(el("div",{class:"err",text:"ошибка: "+e.message})); return; }
  const u = d.user||{}, p = d.profile||{};
  clear(sheet);
  sheet.append(el("button",{class:"close",onclick:()=>$("overlay").classList.remove("on"),text:"закрыть"}));
  sheet.append(el("h2",{text:u.email||("#"+id)}));
  sheet.append(el("div",{class:"muted",text:(u.name||"")+" · регистрация "+fmtDate(u.created_at)}));

  sheet.append(section("портрет", el("div",{class:"block",text:p.compiled||"не собран"})));
  if (p.insights) sheet.append(section("что агент узнал (инсайты)", el("div",{class:"block",text:p.insights})));
  if (p.raw_info) sheet.append(section("что сам рассказал", el("div",{class:"block",text:p.raw_info})));

  const diaryBody = (d.diary||[]).length
    ? (d.diary||[]).map(e => el("div",{class:"entry"}, el("div",{class:"d",text:fmtDate(e.ts)}), e.text||"", e.feedback?el("div",{class:"fb",text:e.feedback}):null))
    : [el("div",{class:"muted",text:"нет записей"})];
  sheet.append(section("дневник ("+(d.diary||[]).length+")", ...diaryBody));

  const msgBody = (d.messages||[]).length
    ? (d.messages||[]).map(m => el("div",{class:"msg "+(m.role==="user"?"user":"assistant")}, el("div",{class:"r",text:(m.role==="user"?"клиент":"психолог")+" · "+fmtDate(m.ts)}), m.content||""))
    : [el("div",{class:"muted",text:"нет переписки"})];
  sheet.append(section("переписка ("+(d.messages||[]).length+")", ...msgBody));

  const docBody = (d.documents||[]).length
    ? (d.documents||[]).map(x => el("div",{class:"muted",text:"• "+(x.name||"файл")+" ("+Math.round((x.size||0)/1024)+"КБ)"}))
    : [el("div",{class:"muted",text:"нет файлов"})];
  sheet.append(section("досье", ...docBody));
}
$("overlay").onclick = (e) => { if (e.target.id==="overlay") $("overlay").classList.remove("on"); };

/* ───────── вкладка «как работает» (механика простым языком) ───────── */
function layer(title, text){ return el("div",{class:"layer"}, el("b",{text:title}), el("div",{class:"t",text:text})); }
function box(head, body){ return el("div",{class:"box"}, el("div",{class:"h",text:head}), el("div",{text:body})); }
function flow(...boxes){ const f=el("div",{class:"flow"}); boxes.forEach((b,i)=>{ if(i) f.append(el("div",{class:"arrow",text:"→"})); f.append(b); }); return f; }
function pipe(items){ const ul=el("ul",{class:"pipe"}); items.forEach(([b,t])=>ul.append(el("li",null, el("b",{text:b}), " — "+t))); return ul; }
function card(title, lead, ...body){ return el("div",{class:"card2"}, el("h2",{text:title}), lead?el("div",{class:"lead",text:lead}):null, ...body); }

function renderHow(){
  clear($("stats"));
  const c=$("content"); clear(c);
  c.append(
    card("Из чего собран характер психолога",
      "Каждый ответ проходит сверху вниз через три слоя инструкций.",
      layer("1. Душа — кто он", "Личный психолог и наставник калифорнийской школы. Говорит сухо и по делу, режет правду без анестезии, не сюсюкает и не философствует. Строчные буквы, без мата."),
      layer("2. Фильтр под текущий ИИ-движок", "У каждого ИИ свой «акцент». На GPT включается анти-подхалимаж: не лижет, не хвалит твои реплики, возражает если ты неправ, убирает дежурные «рад помочь». На других движках гасятся их косяки — многословие, лишняя вежливость, оговорки."),
      layer("3. Анти-ИИ голос", "Вычищает машинные обороты, по которым виден ИИ: «важно отметить», «не просто X, а Y», списки по три, лишние тире. Чтобы звучал как живой человек.")
    ),
    card("Как рождается ответ в чате",
      "Путь одного сообщения — слева направо.",
      flow(
        box("что знает о тебе","портрет + что узнал в работе + дневник + прошлая переписка"),
        box("фильтр движка","глушит почерк ИИ"),
        box("характер","наставник, без воды"),
        box("лимит","1–2 строки"),
        box("вывод","печатает по символам")
      ),
      el("div",{class:"muted small"},"Ответ идёт живым потоком по буквам, не цельным блоком.")
    ),
    card("Вкладки и их механика",
      "Что во что превращается.",
      pipe([
        ["ЧАТ","твоё сообщение + всё, что система о тебе знает → психолог отвечает. После ответа в фоне обновляет заметки о тебе."],
        ["MOOD (оценка 0–100)","две части: база (ответы на психологические тесты) + актуальное (что видно в дневнике и переписке за последние дни), усредняются. Под замком, пока не пройдёшь все тесты."],
        ["настрой за 10 дней","ИИ читает дневник и реплики за 10 дней → одно число и короткое резюме, как ты жил эти дни. Мало записей — не считает, ставит замок."],
        ["итоги недели","твои реплики за 7 дней → три блока: в фокусе / сдвиг / ориентир."],
        ["портрет","все источники сразу (тесты + дневник + досье + твои лайки на прошлые портреты) → 5 глубоких блоков. Учится на фидбеке и пишет точнее."],
        ["дневник","пишешь → орфография чистится → психолог даёт короткий отклик-ревью (без вопросов) → запись уходит в твой Apple Notes."]
      ])
    ),
    card("Память и синхронизация", null,
      pipe([
        ["Один аккаунт везде","что пишешь боту в Telegram и что в приложении — одна общая база. Заходишь где угодно — видишь всё."],
        ["Apple Notes","записи дневника копируются в твою папку «Психолог». Только твои, чужие недоступны."],
        ["Само-обучение","после разговоров агент тихо фиксирует устойчивое о тебе (паттерны, триггеры, что помогает) и опирается на это дальше."]
      ])
    ),
    card("Движки и защита", null,
      pipe([
        ["Сейчас работает","Gemini 3 Flash (чат, дневник, фон) и Gemini 3.1 Pro (портрет, итоги, /ask) — через OpenRouter. Если упал — автоматически встают бесплатные модели, без остановки. Модели меняются во вкладке «техника»."],
        ["Защита входа","Face ID или 4-значный код. Хранится только на твоём устройстве."]
      ])
    )
  );
}

let curTab="users";
/* ───────── вкладка «техника»: управление промптами + базы ───────── */
async function apiPost(path, body){
  const r=await fetch(path,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw Object.assign(new Error("HTTP "+r.status),{status:r.status});
  return r.json();
}
const CAT_TITLE={model:"модели в стеке",prompt:"промпты — на всех этапах",filter:"фильтры под модель",order:"порядок слоёв",setting:"настройки"};
const MODEL_PRESETS=[
  ["","— текущий стек —"],
  ["google/gemini-3-flash-preview","Gemini 3 Flash · быстрый"],
  ["google/gemini-3.1-pro-preview","Gemini 3.1 Pro · глубокий (think)"],
  ["anthropic/claude-sonnet-4.6","Claude Sonnet 4.6"],
  ["gpt-5","GPT-5 · OpenAI (think)"],
  ["deepseek/deepseek-v4-pro","DeepSeek V4 Pro · think"],
  ["deepseek/deepseek-chat-v3.1","DeepSeek V3.1 · быстрый"],
  ["openai/gpt-oss-120b:free","gpt-oss 120B · free"],
];
const modelLabel=(m)=>{ const p=MODEL_PRESETS.find(x=>x[0]===m); return p?p[1]:(m||"текущий стек"); };
function details(title, open, ...body){
  const d=el("details",{class:"sec2"}); if(open) d.setAttribute("open","");
  d.append(el("summary",{text:title}));
  const b=el("div",{class:"sec2-body"}); body.forEach(x=>x&&b.append(x)); d.append(b);
  return d;
}
function modelSelect(val, onPick){
  const s=el("select",{class:"tc-sel"});
  MODEL_PRESETS.forEach(([v,l])=>{ const o=el("option",{value:v,text:l}); if(v===val)o.setAttribute("selected",""); s.append(o); });
  if(onPick) s.onchange=()=>onPick(s.value);
  return s;
}
function mrTile(h,m,d){ return el("div",{class:"mr-tile"}, el("div",{class:"h",text:h}), el("div",{class:"m",text:m}), el("div",{class:"d",text:d})); }
function dbInfoBody(){
  const rows=[
    ["профиль","портрет (что видит клиент), ответы тестов, инсайты «что узнал», настрой за 10 дней"],
    ["переписка","все сообщения чата — одна база на Telegram и приложение"],
    ["дневник","записи + короткие отклики психолога"],
    ["отметки настроения","ежедневный пульс для оценки MOOD"],
    ["досье","загруженные тобой файлы про себя"],
    ["лайки портрета","твои отзывы — агент учится писать портрет точнее"],
    ["конфиг агента","модели, промпты, фильтры, настройки (редактируются здесь)"],
  ];
  const ul=el("ul",{class:"pipe"}); rows.forEach(([a,b])=>ul.append(el("li",null,el("b",{text:a})," — "+b)));
  return ul;
}
function flash(box,msg,bad){ const f=el("span",{class:"cfg-flash"+(bad?" bad":""),text:msg}); box.append(f); setTimeout(()=>f.remove(),1800); }
function cfgEditor(it){
  const box=el("div",{class:"cfg"});
  box.append(el("div",{class:"cfg-h"}, el("b",{text:it.label}), it.overridden?el("span",{class:"pill on",text:"изменён"}):null));
  if(it.desc) box.append(el("div",{class:"cfg-d",text:it.desc}));
  const multiline = it.cat==="prompt"||it.cat==="filter";
  const field = multiline ? el("textarea",{class:"cfg-area"}) : el("input",{class:"cfg-input"});
  field.value = it.overridden ? it.value : it.default;     // пустой override не подменяем дефолтом
  box.append(field);
  const act=el("div",{class:"cfg-act"});
  const save=el("button",{class:"cfg-btn",text:"сохранить"});
  save.onclick=async()=>{ save.textContent="…"; try{ await apiPost("/api/admin/config",{key:it.key,value:field.value}); flash(box,"сохранено · бот учтёт за ~15 сек ✓"); }catch(e){ flash(box,"ошибка: "+e.message,true);} save.textContent="сохранить"; };
  act.append(save);
  if(it.cat==="order"){
    const swap=el("button",{class:"cfg-btn ghost",text:"поменять блоки местами"});
    swap.onclick=()=>{ field.value=field.value.split(",").map(s=>s.trim()).filter(Boolean).reverse().join(","); };
    act.append(swap);
  }
  const rst=el("button",{class:"cfg-btn ghost",text:"вернуть как было"});
  rst.onclick=async()=>{ try{ await apiPost("/api/admin/config",{key:it.key,reset:true}); field.value=it.default; flash(box,"сброшено к дефолту"); }catch(e){ flash(box,"ошибка",true);} };
  act.append(rst);
  box.append(act);
  return box;
}
/* редактор модели: дропдаун пресетов + «другая…» (raw-поле только при custom). сохранение в 1 клик. */
function modelRow(it){
  const box=el("div",{class:"cfg"});
  const head=el("div",{class:"cfg-h"}, el("b",{text:it.label}), it.overridden?el("span",{class:"pill on",text:"изменён"}):null);
  box.append(head);
  const cur=it.overridden?it.value:it.default;
  const known=MODEL_PRESETS.some(p=>p[0]&&p[0]===cur);
  const sel=el("select",{class:"tc-sel"});
  MODEL_PRESETS.filter(p=>p[0]).forEach(([v,l])=>{ const o=el("option",{value:v,text:l}); if(v===cur)o.setAttribute("selected",""); sel.append(o); });
  sel.append(el("option",{value:"__other",text:"другая модель…"}));
  const raw=el("input",{class:"cfg-input",placeholder:"провайдер/модель, напр. google/gemini-3-flash-preview"});
  raw.value=cur; raw.style.marginTop="8px"; raw.hidden=known; if(!known) sel.value="__other";
  sel.onchange=()=>{ if(sel.value==="__other"){ raw.hidden=false; raw.focus(); } else { raw.hidden=true; raw.value=sel.value; } };
  const act=el("div",{class:"cfg-act"});
  const save=el("button",{class:"cfg-btn",text:"сохранить"});
  save.onclick=async()=>{ const val=sel.value==="__other"?raw.value.trim():sel.value; if(!val) return; save.textContent="…"; try{ await apiPost("/api/admin/config",{key:it.key,value:val}); flash(box,"сохранено · применится за ~15 сек ✓"); }catch(e){ flash(box,"ошибка: "+e.message,true);} save.textContent="сохранить"; };
  const rst=el("button",{class:"cfg-btn ghost",text:"вернуть как было"});
  rst.onclick=async()=>{ try{ await apiPost("/api/admin/config",{key:it.key,reset:true}); flash(box,"сброшено к дефолту"); }catch(e){ flash(box,"ошибка",true);} };
  act.append(save,rst);
  box.append(sel, raw, act);
  return box;
}
function modelsCard(items){
  const m=items.filter(i=>i.cat==="model");
  const gv=(k)=>{ const it=m.find(x=>x.key===k); return it?(it.overridden?it.value:it.default):"—"; };
  const card=el("div",{class:"card2"});
  card.append(el("h2",{text:"модели в стеке"}));
  card.append(el("div",{class:"lead",text:"что какой моделью считается. имя с «/» = через OpenRouter, без «/» = нативный OpenAI. меняешь дропдауном → сохранить → применится за ~15 сек, без деплоя."}));
  card.append(el("div",{class:"model-route"},
    mrTile("чат · дневник · фон", gv("model_chat"), "быстро, без reasoning"),
    mrTile("портрет · итоги · /ask", gv("model_deep"), "глубоко, можно think"),
    mrTile("если упало", "free-цепочка", "qwen → gpt-oss → llama → deepseek, авто")
  ));
  m.forEach(it=>card.append(modelRow(it)));
  return card;
}
/* песочница: тот же характер+промпты, без записи. A/B — один вопрос двум моделям рядом. */
function streamInto(node,q,hist,model,log,overrides){
  return new Promise(async(resolve)=>{
    node.textContent="…";
    try{
      const res=await fetch("/api/admin/test-chat",{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({q,history:hist,model:model||"",overrides:overrides||{}})});
      if(!res.ok||!res.body){ node.textContent="ошибка "+res.status; return resolve(""); }
      const rd=res.body.getReader(),dec=new TextDecoder(); let acc=""; node.textContent="";
      while(true){ const {value,done}=await rd.read(); if(done)break; acc+=dec.decode(value,{stream:true}); node.textContent=acc; if(log)log.scrollTop=log.scrollHeight; }
      resolve(acc);
    }catch(e){ node.textContent="сорвалось: "+e.message; resolve(""); }
  });
}
function testChat(items){
  const card=el("div",{class:"card2"});
  card.append(el("h2",{text:"песочница · A/B"}));
  card.append(el("div",{class:"lead",text:"твой реальный характер и текущие промпты. НЕ сохраняется. тумблеры ниже влияют ТОЛЬКО на песочницу и мгновенно — щёлкнул, отправил, услышал разницу. сравнение: включи B/C/D — один вопрос уйдёт во все модели сразу, колонки рядом."}));
  let modelA="", modelB="google/gemini-3.1-pro-preview", modelC="anthropic/claude-sonnet-4.6", modelD="gpt-5";
  const en={ B:false, C:false, D:false };
  const selA=modelSelect(modelA, v=>modelA=v);
  // слот сравнения: галочка включает колонку, селект рядом (вне label, чтобы не переключал галку)
  const mkSlot=(letter,set)=>{
    const sel=modelSelect(letter==="B"?modelB:letter==="C"?modelC:modelD, set); sel.disabled=true;
    const c=el("input",{type:"checkbox"}); c.onchange=()=>{ en[letter]=c.checked; sel.disabled=!c.checked; };
    return el("span",{class:"tc-slot"}, el("label",{class:"tc-check"}, c, letter), sel);
  };
  const bar=el("div",{class:"tc-bar"},
    el("span",{class:"muted small",text:"A:"}), selA,
    mkSlot("B", v=>modelB=v), mkSlot("C", v=>modelC=v), mkSlot("D", v=>modelD=v));
  // тумблеры слоёв промпта (мгновенные per-call оверрайды, без сохранения)
  const tog={ soul:true, system_base:true, filter:true };
  const filterKeys=items.filter(i=>i.cat==="filter").map(i=>i.key);
  const lenItem=items.find(i=>i.key==="chat_max_tokens");
  const lenDef=lenItem?(lenItem.overridden?lenItem.value:lenItem.default):"150";
  const mkTog=(key,label)=>{ const c=el("input",{type:"checkbox"}); c.checked=true; c.onchange=()=>tog[key]=c.checked; return el("label",{class:"tc-check"}, c, label); };
  const lenInp=el("input",{class:"tc-len",type:"number",min:"30",max:"800"}); lenInp.value=lenDef;
  const settings=el("div",{class:"tc-settings"},
    el("span",{class:"muted small",text:"в промпте:"}),
    mkTog("soul","душа"), mkTog("system_base","характер+правила"), mkTog("filter","анти-ИИ фильтр"),
    el("span",{class:"muted small",style:"margin-left:auto"},"длина ↦"), lenInp);
  function overrides(){
    const o={};
    if(!tog.soul) o.soul="";
    if(!tog.system_base) o.system_base="";
    if(!tog.filter) filterKeys.forEach(k=>o[k]="");
    const L=parseInt(lenInp.value,10); if(L>0) o.chat_max_tokens=String(L);
    return o;
  }
  const log=el("div",{class:"tc-log"});
  const inp=el("textarea",{class:"cfg-area tc-inp",rows:"2",placeholder:"вопрос психологу…"});
  const send=el("button",{class:"cfg-btn",text:"отправить"});
  const clr=el("button",{class:"tc-clear",text:"очистить"});
  const hist=[]; let busy=false;
  clr.onclick=()=>{ hist.length=0; clear(log); };
  async function go(){
    const q=inp.value.trim(); if(!q||busy) return;
    busy=true; send.disabled=true; inp.value="";
    const ov=overrides();
    log.append(el("div",{class:"msg user"}, el("div",{class:"r",text:"ты"}), q));
    // активные колонки: A всегда + включённые B/C/D
    const models=[["A",modelA]];
    if(en.B) models.push(["B",modelB]);
    if(en.C) models.push(["C",modelC]);
    if(en.D) models.push(["D",modelD]);
    let aText="";
    if(models.length===1){
      const ans=el("div",{class:"msg assistant"}, el("div",{class:"r",text:modelLabel(modelA)})); const t=document.createTextNode(""); ans.append(t); log.append(ans); log.scrollTop=log.scrollHeight;
      aText=await streamInto(t,q,hist,modelA,log,ov);
    } else {
      const cols=models.map(([L,m])=>{
        const col=el("div",{class:"tc-col"}, el("div",{class:"h",text:L+" · "+modelLabel(m)}));
        const tn=document.createTextNode(""); col.append(el("div",{class:"msg assistant"},tn));
        return {col,tn,m};
      });
      const wrap=el("div",{class:"tc-cols"}); cols.forEach(c=>wrap.append(c.col));
      log.append(wrap); log.scrollTop=log.scrollHeight;
      const r=await Promise.all(cols.map(c=>streamInto(c.tn,q,hist,c.m,log,ov))); aText=r[0];
    }
    hist.push({role:"user",content:q}); hist.push({role:"assistant",content:aText}); if(hist.length>20) hist.splice(0,hist.length-20);
    log.scrollTop=log.scrollHeight; busy=false; send.disabled=false; inp.focus();
  }
  send.onclick=go;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); go(); }});
  card.append(bar, settings, log, el("div",{class:"tc-row"}, inp, send), el("div",{style:"margin-top:8px"}, clr));
  return card;
}
async function renderTech(){
  clear($("stats"));
  const c=$("content"); clear(c); c.append(el("div",{class:"muted",text:"загружаю…"}));
  let data;
  try{ data=await api("/api/admin/config"); }
  catch(e){ showErr(e.status===403?"доступ только для владельца":"ошибка: "+e.message); return; }
  clear(c);
  const items=data.items||[];
  c.append(modelsCard(items));          // 1. модели (открыто)
  c.append(testChat(items));            // 2. песочница + A/B + тумблеры (открыто)
  const group=(cats, lead)=>{
    const list=items.filter(i=>cats.includes(i.cat)); if(!list.length) return null;
    const b=el("div"); if(lead) b.append(el("div",{class:"lead",text:lead}));
    list.forEach(it=>b.append(cfgEditor(it)));
    return b;
  };
  const proms=group(["prompt"]); if(proms) c.append(details("промпты — на всех этапах",false,proms));
  const fils=group(["filter"]); if(fils) c.append(details("фильтры под модель",false,fils));
  const os=group(["order","setting"],"фильтр модели всегда первым, дальше — как тут. перетасуй блоки — меняешь хронологию подачи."); if(os) c.append(details("порядок слоёв · настройки",false,os));
  c.append(details("базы данных — что хранится про тебя",false,dbInfoBody()));
}

function buildTabs(){
  const t=$("tabs"); clear(t);
  [["users","тестировщики"],["how","как работает"],["tech","техника"]].forEach(([id,label])=>
    t.append(el("button",{class:"tab"+(curTab===id?" on":""),onclick:()=>switchTab(id),text:label})));
}
function switchTab(id){
  curTab=id; buildTabs();
  $("stats").style.display = id==="users" ? "flex" : "none";
  if(id==="users") load(); else if(id==="how") renderHow(); else renderTech();
}
buildTabs();
switchTab("users");

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>soul — центр управления</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400..600&display=swap">
<style>
/* ─────────── Liquid Glass: слои поверх живого фона, минимум хрома ─────────── */
:root{
  --bg:#0d0b09; --ink:#f2ede4; --dim:#9d968a; --faint:#6b665d;
  --accent:#c0a080; --accent-2:#4f8a82; --bad:#c9705a;
  --glass:rgba(255,255,255,.055);
  --glass-hi:rgba(255,255,255,.13);
  --stroke:rgba(255,255,255,.09);
  --r:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font:400 15px/1.5 Manrope,-apple-system,BlinkMacSystemFont,sans-serif;
  letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
  padding:0 20px 80px; overflow-x:hidden;
}
/* живой фон — из-за него у стекла есть что преломлять */
body::before{
  content:""; position:fixed; inset:-25%; z-index:-1; pointer-events:none;
  background:
    radial-gradient(50% 40% at 20% 12%, rgba(192,160,128,.20), transparent 70%),
    radial-gradient(45% 38% at 82% 24%, rgba(79,138,130,.16), transparent 70%),
    radial-gradient(60% 50% at 50% 96%, rgba(192,160,128,.10), transparent 70%);
  filter:blur(40px);
  animation:drift 24s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translate3d(0,-3%,0) scale(1.06)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}

.wrap{max-width:760px;margin:0 auto}
header{padding:40px 4px 22px}
h1{
  font:600 30px/1.1 Fraunces,Georgia,serif; letter-spacing:.4px;
  font-variation-settings:"SOFT" 40,"opsz" 144;
}
.sub{color:var(--dim); font-size:13px; margin-top:7px}

.glass{
  background:var(--glass);
  backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--stroke); border-radius:var(--r);
  box-shadow:0 1px 0 var(--glass-hi) inset, 0 18px 48px rgba(0,0,0,.34);
}

nav{
  display:flex; gap:2px; padding:4px; margin-bottom:22px;
  position:sticky; top:14px; z-index:20;
}
nav button{
  flex:1; padding:11px 8px; border:0; border-radius:19px; cursor:pointer;
  background:transparent; color:var(--dim); font:600 13px Manrope,sans-serif;
  letter-spacing:.2px; transition:color .25s, background .35s cubic-bezier(.32,.72,0,1);
}
nav button[aria-selected="true"]{
  color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  box-shadow:0 1px 0 var(--glass-hi) inset, 0 4px 14px rgba(0,0,0,.22);
}
nav button:active{transform:scale(.97)}

section{display:grid; gap:14px; animation:rise .4s cubic-bezier(.32,.72,0,1)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}}
[hidden]{display:none!important}

.card{padding:20px 22px}
.card h2{
  font:600 12px Manrope,sans-serif; letter-spacing:1.3px; text-transform:uppercase;
  color:var(--faint); margin-bottom:14px;
}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.tile{padding:15px 16px;border-radius:19px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.tile .n{font:600 25px/1 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}
.tile .k{font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:.3px}

.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:0}
.row .k{color:var(--dim);font-size:13px}
.row .v{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.ok{background:var(--accent-2);box-shadow:0 0 9px var(--accent-2)}
.no{background:var(--bad);box-shadow:0 0 9px var(--bad)}

details{border-bottom:1px solid rgba(255,255,255,.05)}
details:last-of-type{border-bottom:0}
summary{
  padding:13px 2px; cursor:pointer; list-style:none; display:flex;
  align-items:center; justify-content:space-between; gap:10px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";color:var(--faint);font-size:19px;transition:transform .3s cubic-bezier(.32,.72,0,1)}
details[open] summary::after{transform:rotate(90deg)}
summary .t{font-size:14px;font-weight:500}
summary .m{font-size:11px;color:var(--faint)}
.edited{color:var(--accent)}

textarea,input,select{
  width:100%; padding:13px 15px; margin-top:4px;
  background:rgba(0,0,0,.28); color:var(--ink);
  border:1px solid var(--stroke); border-radius:16px;
  font:400 13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical;
  transition:border-color .2s, background .2s;
}
textarea:focus,input:focus,select:focus{outline:0;border-color:rgba(192,160,128,.5);background:rgba(0,0,0,.4)}
select{font-family:Manrope,sans-serif;font-size:13px;cursor:pointer}
select option{background:#171310}

.acts{display:flex;gap:8px;margin:11px 0 15px;align-items:center;flex-wrap:wrap}
button.b{
  padding:10px 17px;border:1px solid var(--stroke);border-radius:15px;cursor:pointer;
  background:rgba(255,255,255,.07); color:var(--ink);
  font:600 13px Manrope,sans-serif; letter-spacing:.2px;
  transition:transform .18s cubic-bezier(.32,.72,0,1), background .2s;
}
button.b:hover{background:rgba(255,255,255,.12)}
button.b:active{transform:scale(.96)}
button.b.main{background:linear-gradient(180deg,rgba(192,160,128,.95),rgba(166,124,82,.95));color:#211a12;border-color:transparent}
button.b.ghost{background:transparent;color:var(--dim)}
.flash{font-size:12px;color:var(--accent-2)}
.flash.bad{color:var(--bad)}

.chat{display:flex;flex-direction:column;gap:9px;max-height:44vh;overflow-y:auto;padding:4px 2px 2px}
.msg{max-width:82%;padding:11px 15px;border-radius:19px;font-size:14px;line-height:1.5;white-space:pre-wrap;animation:rise .3s ease}
.me{align-self:flex-end;background:rgba(192,160,128,.2);border:1px solid rgba(192,160,128,.24)}
.him{align-self:flex-start;background:rgba(255,255,255,.055);border:1px solid var(--stroke)}
.meta{font-size:11px;color:var(--faint);padding:2px 4px}
.ask{display:flex;gap:9px;margin-top:13px}
.ask input{margin:0;font-family:Manrope,sans-serif;font-size:14px}

/* ручки характера */
.dial{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.dial:last-of-type{border-bottom:0}
.dial-h{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.dial-t{font-size:14px;font-weight:600}
.dial-hint{font-size:11px;color:var(--faint)}
.scale{display:flex;gap:5px}
.seg{
  flex:1;height:30px;border:1px solid var(--stroke);border-radius:11px;cursor:pointer;
  background:rgba(255,255,255,.03);
  transition:background .3s cubic-bezier(.32,.72,0,1),transform .18s,border-color .25s;
}
.seg:hover{background:rgba(255,255,255,.08)}
.seg:active{transform:scale(.94)}
.seg[aria-selected="true"]{
  background:linear-gradient(180deg,rgba(192,160,128,.9),rgba(166,124,82,.85));
  border-color:transparent; box-shadow:0 3px 12px rgba(192,160,128,.24);
}
.dial-note{font-size:11px;color:var(--dim);margin-top:7px;min-height:14px}

.empty{color:var(--faint);font-size:13px;padding:14px 2px}
a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>центр управления</h1>
    <div class="sub" id="sub">загружаю…</div>
  </header>

  <nav class="glass" role="tablist">
    <button role="tab" data-v="pulse" aria-selected="true">пульс</button>
    <button role="tab" data-v="soul" aria-selected="false">личность</button>
    <button role="tab" data-v="try" aria-selected="false">проба</button>
  </nav>

  <section id="pulse"></section>
  <section id="soul" hidden></section>
  <section id="try" hidden></section>
</div>

<script>
const $ = (id) => document.getElementById(id);

/* Вход один раз: бот присылает ссылку с #token=… (в Telegram владелец уже подтверждён).
   Забираем токен, прячем в браузер и вычищаем из адреса, чтобы не светился в истории. */
(() => {
  const m = location.hash.match(/token=([^&]+)/);
  if (!m) return;
  try { localStorage.setItem("mood_token", decodeURIComponent(m[1])); } catch (_) {}
  history.replaceState(null, "", location.pathname);
})();
const token = localStorage.getItem("mood_token") || "";
const H = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };

const api = async (p, body) => {
  const r = await fetch(p, body ? { method:"POST", headers:H, body:JSON.stringify(body) }
                              : { headers:H, cache:"no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
};
/** Единственный конструктор DOM: тег, свойства, дети. Больше панели ничего не нужно. */
const e = (tag, p = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(p || {})) {
    if (v == null) continue;
    if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  n.append(...kids.filter(Boolean));
  return n;
};
const card = (title, ...body) => e("div",{class:"card glass"}, title && e("h2",{text:title}), ...body);
const row = (k, v, cls) => e("div",{class:"row"}, e("span",{class:"k",text:k}), e("span",{class:"v "+(cls||""),text:v}));
const tile = (n, k) => e("div",{class:"tile"}, e("div",{class:"n",text:String(n)}), e("div",{class:"k",text:k}));
const state = (k, ok, txt) => e("div",{class:"row"},
  e("span",{class:"k",text:k}),
  e("span",{class:"v"}, e("span",{class:"dot "+(ok?"ok":"no")}), document.createTextNode(txt)));
const flash = (host, msg, bad) => {
  const f = e("span",{class:"flash"+(bad?" bad":""),text:msg});
  host.append(f); setTimeout(() => f.remove(), 2000);
};
const ago = (ts) => {
  if (!ts) return "—";
  const d = Math.floor((Date.now()/1000 - ts) / 86400);
  return d <= 0 ? "сегодня" : d === 1 ? "вчера" : d + " дн. назад";
};

let DATA = null, ITEMS = [];

/* ─── пульс: что происходит прямо сейчас ─── */
function renderPulse() {
  const s = $("pulse"); s.replaceChildren();
  const { users = [], config = {}, safety = {}, models = {} } = DATA || {};
  const sum = (f) => users.reduce((a, u) => a + (u[f] || 0), 0);
  const week = users.filter(u => u.last_activity && Date.now()/1000 - u.last_activity < 604800).length;

  s.append(card(null, e("div",{class:"tiles"},
    tile(users.length, "людей"),
    tile(sum("messages"), "сообщений"),
    tile(sum("diary"), "записей"),
    tile(week, "активны за неделю"),
  )));

  const problems = config.problems || [];
  s.append(card("личность в проде",
    row("версия конфига", "v" + (config.version || "?")),
    row("файлов · ключей", (config.files || 0) + " · " + (config.keys || 0)),
    state("валидация", !problems.length, problems.length ? problems.length + " проблем" : "чисто"),
    state("детектор риска", !!safety.markers_ok, safety.markers_ok ? "самопроверка пройдена" : "ЛЕКСИКОН СЛОМАН"),
    row("кризисных номеров", String(safety.numbers ?? 0)),
    ...problems.map(p => row("!", p, "mono")),
  ));

  s.append(card("модели",
    row("чат", models.model_chat || "—", "mono"),
    row("глубокие задачи", models.model_deep || "—", "mono"),
    row("редактор-голос", models.humanizer_model || "—", "mono"),
    row("редактор включён", models.humanize_on === "1" ? "да" : "нет"),
  ));

  s.append(card("люди", ...(users.length
    ? users.map(u => row(u.email || ("#" + u.id),
        `${u.messages || 0} сообщ. · ${u.diary || 0} зап. · ${ago(u.last_activity)}`))
    : [e("div",{class:"empty",text:"пока никого"})])));
}

/* ─── личность: правка того, чем психолог говорит ─── */
const CAT = { prompt:"промпты", filter:"фильтры моделей", model:"модели", setting:"настройки", order:"порядок" };

function mark(it) {
  const m = document.querySelector(`[data-mark="${it.key}"]`);
  if (!m) return;
  m.textContent = it.overridden ? "изменён" : "из файла";
  m.className = "m" + (it.overridden ? " edited" : "");
}
function editor(it) {
  const text = it.value || it.default || "";
  const ta = e("textarea",{rows:String(Math.min(18, Math.max(4, text.split("\n").length + 1)))});
  ta.value = text;
  const acts = e("div",{class:"acts"});
  const save = e("button",{class:"b main",text:"сохранить",onclick:async()=>{
    try { await api("/api/admin/config", {key:it.key, value:ta.value});
          it.value = ta.value; it.overridden = true; mark(it); flash(acts,"сохранено ✓"); }
    catch (err) { flash(acts, "ошибка: " + err.message, true); }
  }});
  const reset = e("button",{class:"b ghost",text:"вернуть файл",onclick:async()=>{
    try { await api("/api/admin/config", {key:it.key, value:""});
          ta.value = it.default || ""; it.value = ""; it.overridden = false; mark(it);
          flash(acts,"вернул из файла ✓"); }
    catch (err) { flash(acts, "ошибка: " + err.message, true); }
  }});
  acts.append(save, reset);
  return e("div", {}, ta, acts);
}
/* ручки характера: смысловые шкалы вместо правки сырого текста */
function dialsCard() {
  const spec = (DATA?.dials?.spec) || [];
  if (!spec.length) return null;
  let chosen = {};
  try { chosen = JSON.parse(DATA.dials.value || "{}") || {}; } catch (_) {}

  const host = e("div");
  const save = async (msgHost) => {
    try { await api("/api/admin/config", { key:"dials", value: JSON.stringify(chosen) });
          DATA.dials.value = JSON.stringify(chosen); flash(msgHost, "применено ✓"); }
    catch (err) { flash(msgHost, "ошибка: " + err.message, true); }
  };

  for (const d of spec) {
    const cur = Number.isInteger(chosen[d.key]) ? chosen[d.key] : (d.default ?? 2);
    const scale = e("div",{class:"scale"});
    const note = e("div",{class:"dial-note"});
    const paint = (i) => {
      [...scale.children].forEach((b, k) => b.setAttribute("aria-selected", String(k === i)));
      note.textContent = (d.levels[i]?.label || "") + (i === (d.default ?? 2) ? " · базовый" : "");
    };
    d.levels.forEach((lv, i) => scale.append(e("button",{ class:"seg", title:lv.label,
      onclick:() => { chosen[d.key] = i; paint(i); save(note); } })));
    paint(cur);
    host.append(e("div",{class:"dial"},
      e("div",{class:"dial-h"},
        e("span",{class:"dial-t",text:d.title}),
        e("span",{class:"dial-hint",text:d.hint || ""})),
      scale, note));
  }
  const acts = e("div",{class:"acts"},
    e("button",{class:"b ghost",text:"вернуть базовые",onclick:async(ev)=>{
      chosen = {}; await save(ev.target.parentNode); renderSoul();
    }}));
  host.append(acts);
  return card("характер", e("div",{class:"sub",
    text:"крутится на лету и ложится поверх базовых слоёв. безопасность, правду и кризис-протокол не отменяет."}), host);
}

function renderSoul() {
  const s = $("soul"); s.replaceChildren();
  const dials = dialsCard();
  if (dials) s.append(dials);
  s.append(card(null, e("div",{class:"sub",
    text:"тексты живут в файлах config/psychologist/ и подхватываются без перезапуска. правка здесь ложится поверх файла — «вернуть файл» её снимает."})));
  for (const [cat, title] of Object.entries(CAT)) {
    const list = ITEMS.filter(i => i.cat === cat);
    if (!list.length) continue;
    s.append(card(title, ...list.map(it => e("details", {},
      e("summary", {},
        e("span",{class:"t",text:it.label}),
        e("span",{class:"m" + (it.overridden ? " edited" : ""), "data-mark":it.key,
                  text: it.overridden ? "изменён" : "из файла"})),
      editor(it)))));
  }
}

/* ─── проба: живой диалог на проде-промпте, мимо истории клиента ─── */
function renderTry() {
  const s = $("try"); s.replaceChildren();
  const log = e("div",{class:"chat"});
  const inp = e("input",{placeholder:"написать психологу…",autocomplete:"off"});
  const hist = [];

  const send = async () => {
    const q = inp.value.trim(); if (!q) return;
    inp.value = "";
    log.append(e("div",{class:"msg me",text:q}));
    const out = e("div",{class:"msg him",text:"…"});
    const meta = e("div",{class:"meta"});
    log.append(out, meta); log.scrollTop = log.scrollHeight;
    const t0 = performance.now();
    try {
      const r = await fetch("/api/admin/test-chat", {method:"POST", headers:H,
        body:JSON.stringify({q, history:hist, model:"", overrides:{}})});
      const rd = r.body.getReader(), dec = new TextDecoder();
      let acc = "";
      for (;;) {
        const {done, value} = await rd.read();
        if (done) break;
        acc += dec.decode(value, {stream:true});
        out.textContent = acc; log.scrollTop = log.scrollHeight;
      }
      hist.push({role:"user", content:q}, {role:"assistant", content:acc});
      meta.textContent = `${((performance.now() - t0)/1000).toFixed(1)}с · ${acc.length} символов`;
    } catch (err) { out.textContent = "сломалось: " + err.message; }
  };
  inp.addEventListener("keydown", ev => { if (ev.key === "Enter") send(); });

  s.append(card("проба голоса",
    e("div",{class:"sub",text:"тот же промпт и те же модели, что в проде. в историю клиента не пишется."}),
    log,
    e("div",{class:"ask"}, inp, e("button",{class:"b main",text:"→",onclick:send})),
  ));
}

const VIEWS = { pulse:renderPulse, soul:renderSoul, try:renderTry };
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  for (const v of Object.keys(VIEWS)) $(v).hidden = true;
  $(b.dataset.v).hidden = false;
  VIEWS[b.dataset.v]();
});

(async () => {
  if (!token) { $("sub").textContent = "нет токена — войди в приложении и вернись сюда"; return; }
  try {
    const [ov, cfg] = await Promise.all([api("/api/admin/overview"), api("/api/admin/config")]);
    DATA = ov; ITEMS = cfg.items || [];
    $("sub").textContent = `${ov.owner_email} · конфиг v${(ov.config || {}).version || "?"}`;
    renderPulse();
  } catch (err) {
    $("sub").textContent = String(err.message).includes("403")
      ? "доступ только владельцу" : "не загрузилось: " + err.message;
  }
})();
</script>
</body>
</html>
